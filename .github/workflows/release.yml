name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # For a real tag push (vX.Y.Z) the version comes from the tag itself.
      # For a manual workflow_dispatch dry-run there is no tag, so fall back to
      # a throwaway dev version — this run will build/pack but not publish.
      - name: Determine version
        id: get-version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.1-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore BSG.Tools.csproj

      - name: Publish application
        run: >
          dotnet publish BSG.Tools.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.get-version.outputs.version }}
          -o publish

      # Pinned so a new vpk release can't silently change packing/upload behaviour between
      # two builds; 1.2.158 is the version that produced v1.0.5/v1.0.6. Bump deliberately.
      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.158

      # Pulls down the previous release's packages (if any) so vpk can compute
      # a delta patch instead of shipping a full download every time.
      # Fails harmlessly on the very first release, when no GitHub Release exists yet.
      - name: Download previous release (for delta packages)
        run: vpk download github --repoUrl "https://github.com/${{ github.repository }}" -o Releases
        continue-on-error: true

      - name: Pack Velopack release
        run: >
          vpk pack
          -u BSG.Tools
          -v ${{ steps.get-version.outputs.version }}
          -p publish
          -e BSG.Tools.exe
          -i Assets/AppIcon.ico
          -o Releases

      # Only push a real GitHub Release when this run was triggered by an actual
      # version tag — a manual workflow_dispatch run stops here (build/pack only).
      - name: Upload release to GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          vpk upload github
          --repoUrl "https://github.com/${{ github.repository }}"
          --token ${{ secrets.GITHUB_TOKEN }}
          -o Releases
          --publish true
          --releaseName "BSG.Tools v${{ steps.get-version.outputs.version }}"
          --tag ${{ github.ref_name }}

      # Checks the release the way installed apps see it, so a green run means apps will
      # actually get the update:
      # - Apps from this version on read the feed from releases/latest/download (UpdateService):
      #   fail if that feed doesn't list this version.
      # - Apps up to v1.0.8 use Velopack's GithubSource, which reads the "list releases" API.
      #   That API has returned v1.0.7/v1.0.8 with an empty asset list, hiding them from those
      #   apps; warn (not fail) so it's visible, since the release itself is fine.
      - name: Verify release is visible to the updater
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.get-version.outputs.version }}"
          feed=$(curl -sfL "https://github.com/${{ github.repository }}/releases/latest/download/releases.win.json") || feed=""
          if ! grep -qF "\"Version\":\"$version\"" <<< "$feed"; then
            echo "::error::releases/latest/download/releases.win.json does not list $version, so installed apps will not detect this update."
            exit 1
          fi
          echo "Feed at releases/latest/download lists $version."

          listed=$(gh api "repos/${{ github.repository }}/releases?per_page=5" --jq ".[] | select(.tag_name == \"${{ github.ref_name }}\") | .assets | length")
          if [[ "${listed:-0}" -eq 0 ]]; then
            echo "::warning::The GitHub list-releases API shows ${{ github.ref_name }} with no assets; apps up to v1.0.8 (GithubSource) won't see this update until it does."
          fi
