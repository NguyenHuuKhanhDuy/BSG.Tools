name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  APP_ID: BSG.Tools
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # A manual workflow_dispatch run has no tag: it builds/packs a throwaway version and skips publishing.
      - name: Determine version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.1-ci.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: >
          dotnet publish ${{ env.APP_ID }}.csproj -c Release -r win-x64 --self-contained true
          -p:Version=${{ env.VERSION }} -o publish

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      # Previous release's package, so vpk can build a delta update. Fails on the very first release.
      - name: Download previous release
        run: vpk download http --url "${{ env.REPO_URL }}/releases/latest/download" -o Releases
        continue-on-error: true

      - name: Pack
        run: >
          vpk pack -u ${{ env.APP_ID }} -v ${{ env.VERSION }} -p publish
          -e ${{ env.APP_ID }}.exe -i Assets/AppIcon.ico -o Releases

      - name: Upload to GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          vpk upload github --repoUrl "${{ env.REPO_URL }}" --token ${{ secrets.GITHUB_TOKEN }}
          -o Releases --publish true --releaseName "${{ env.APP_ID }} v${{ env.VERSION }}" --tag ${{ github.ref_name }}

      # Apps from v1.0.9 read the feed from releases/latest/download; older apps read the list-releases API.
      - name: Verify release is visible to the updater
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          feed=$(curl -sfL "$REPO_URL/releases/latest/download/releases.win.json") || feed=""
          if ! grep -qF "\"Version\":\"$VERSION\"" <<< "$feed"; then
            echo "::error::releases/latest/download/releases.win.json does not list $VERSION, so installed apps will not detect this update."
            exit 1
          fi

          listed=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=5" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .assets | length")
          if [[ "${listed:-0}" -eq 0 ]]; then
            echo "::warning::The list-releases API shows $GITHUB_REF_NAME with no assets; apps up to v1.0.8 won't see this update."
          fi
